name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Fixture and test files stay on example data
        run: npm run test:fixture-emails
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - name: End-to-end
        run: npm run e2e
      - name: OS crawler
        run: npm run test:crawl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: os-crawl-report
          path: |
            test-results
            playwright-report
            artifacts/os-checker
          if-no-files-found: ignore
